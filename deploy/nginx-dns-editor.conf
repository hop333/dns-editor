# Reverse proxy: UI на 80/443, API только через /api -> 127.0.0.1:8000
#
# Установка (Ubuntu 24.04):
#   sudo cp deploy/nginx-dns-editor.conf /etc/nginx/sites-available/dns-editor
#   sudo ln -sf /etc/nginx/sites-available/dns-editor /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Замените dns.example.com на ваш домен или _ для доступа по IP.

upstream dns_frontend {
    server 127.0.0.1:3000;
    keepalive 8;
}

upstream dns_backend {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name dns.example.com;

    # Редирект на HTTPS (раскомментируйте после certbot)
    # return 301 https://$host$request_uri;

    location /api/ {
        proxy_pass http://dns_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://dns_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

